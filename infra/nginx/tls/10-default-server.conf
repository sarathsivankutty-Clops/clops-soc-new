# Default server: anything addressed to a hostname this deployment does not
# own is closed with 444 (nginx sends no response at all, so there is no
# version banner and no certificate error page to fingerprint).
#
# 444 on both listeners rather than `ssl_reject_handshake`: a TLS alert is
# marginally quieter about the hostname, but it also makes a mistyped DNS name
# look like a broken server to an operator who is debugging exactly that.
# The trade-off is that the 443 default presents the soc certificate for any
# name; that certificate is public anyway.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    server_tokens off;

    # The compose healthcheck, reached by IP with an arbitrary Host header.
    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
    }

    location / {
        return 444;
    }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/soc.cloudifyops.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/soc.cloudifyops.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        return 444;
    }
}
