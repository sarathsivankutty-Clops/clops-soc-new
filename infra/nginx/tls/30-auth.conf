# auth.cloudifyops.com — Keycloak identity provider behind the TLS edge.
#
# Reaches `keycloak:8080` over the internal `clops-soc` compose network using
# plain HTTP (`--http-enabled=true` and `--proxy-headers=xforwarded`).
#
# The administration console (`/admin`) and the master realm (`/realms/master`)
# are blocked from the public internet with 403 Forbidden; operators access the
# admin console only over an SSH tunnel to the loopback-bound port
# `127.0.0.1:18080->8080` (`--hostname-admin=http://127.0.0.1:18080`).

server {
    listen 80;
    listen [::]:80;
    include /etc/nginx/snippets/server-name-auth.conf;
    include /etc/nginx/snippets/security-headers.conf;
    server_tokens off;

    include /etc/nginx/snippets/acme-challenge.conf;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    include /etc/nginx/snippets/server-name-auth.conf;
    include /etc/nginx/snippets/security-headers.conf;
    server_tokens off;

    # ── TLS ──────────────────────────────────────────────────────────────────
    ssl_certificate /etc/letsencrypt/live/auth.cloudifyops.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/auth.cloudifyops.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/auth.cloudifyops.com/chain.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:aisoc_tls:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 127.0.0.11 valid=300s ipv6=off;
    resolver_timeout 5s;

    # HSTS — enable after verifying certificates and OIDC redirects (see docs/DEPLOY-KEYCLOAK.md).
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 8m;

    set $keycloak_upstream http://keycloak:8080;

    # Block the admin console and master realm from the public internet.
    # Reachable only via SSH tunnel to 127.0.0.1:18080.
    location = /admin {
        return 403;
    }
    location ^~ /admin/ {
        return 403;
    }
    location = /realms/master {
        return 403;
    }
    location ^~ /realms/master/ {
        return 403;
    }

    # Rate-limit login actions (form credential posts) and OIDC auth/token endpoints.
    location ~ ^/realms/[^/]+/login-actions/ {
        limit_req zone=aisoc_login burst=10 nodelay;
        include /etc/nginx/snippets/proxy-headers.conf;
        proxy_read_timeout 60s;
        proxy_pass $keycloak_upstream;
    }

    location ~ ^/realms/[^/]+/protocol/openid-connect/(auth|token|registrations) {
        limit_req zone=aisoc_auth burst=20 nodelay;
        include /etc/nginx/snippets/proxy-headers.conf;
        proxy_read_timeout 60s;
        proxy_pass $keycloak_upstream;
    }

    location / {
        include /etc/nginx/snippets/proxy-headers.conf;
        proxy_read_timeout 120s;
        proxy_pass $keycloak_upstream;
    }
}
