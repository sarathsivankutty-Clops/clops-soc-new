# soc.cloudifyops.com — the console, its API proxy, and the live-update
# gateway. Reached only through this file: web and realtime publish no host
# port in docker-compose.yml.
#
# The hostname appears in exactly two places here: the `server_name` include
# (snippets/server-name-soc.conf) and the certificate paths below, which
# Certbot names after the domain. A second host is a second block
# (30-auth.conf.example), never an edit to this one.

# :80 serves the ACME challenge and nothing else. The redirect is 301 rather
# than 302 so a browser caches it; the challenge location is `^~` and is
# matched before the redirect, so renewal keeps working after this goes live.
server {
    listen 80;
    listen [::]:80;
    include /etc/nginx/snippets/server-name-soc.conf;
    include /etc/nginx/snippets/security-headers.conf;
    server_tokens off;

    include /etc/nginx/snippets/acme-challenge.conf;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    include /etc/nginx/snippets/server-name-soc.conf;
    include /etc/nginx/snippets/security-headers.conf;
    server_tokens off;

    # ── TLS ──────────────────────────────────────────────────────────────────
    ssl_certificate /etc/letsencrypt/live/soc.cloudifyops.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/soc.cloudifyops.com/privkey.pem;
    # The issuer chain, used to validate the OCSP response itself.
    ssl_trusted_certificate /etc/letsencrypt/live/soc.cloudifyops.com/chain.pem;

    # 1.2 is kept for the long tail of TLS-1.2-only clients; 1.3 is preferred
    # and needs no cipher list of its own.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:aisoc_tls:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # OCSP stapling: nginx fetches the response and staples it, so the browser
    # does not call the CA's responder for every connection. Docker's embedded
    # DNS resolves the responder hostname; without a resolver this directive
    # silently does nothing.
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 127.0.0.11 valid=300s ipv6=off;
    resolver_timeout 5s;

    # HSTS — present but disabled on purpose. It is a one-way promise: a
    # browser that receives it refuses plain HTTP for max-age, so enabling it
    # before the certificate, the redirect and the websocket path are verified
    # pins a broken deployment into every visitor's browser. Enable it (and
    # only then) by uncommenting the line below after docs/DEPLOY-HTTPS.md
    # step 6 passes.
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Uploads: connector credential bundles, CSV/JSON ingestion, case
    # attachments. The API's own limits still apply.
    client_max_body_size 50m;

    # Resolved per request through Docker DNS. `proxy_pass` with a literal
    # upstream caches the container IP at startup and keeps sending to it after
    # a recreate; with a variable nginx re-resolves, so `docker compose up -d
    # web` does not need an nginx reload.
    set $web_upstream http://web:3000;
    set $realtime_upstream http://realtime:4000;
    set $keycloak_upstream http://keycloak:8080;

    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
    }

    # Block Keycloak admin console and master realm on the public listener.
    # Reachable only over an SSH tunnel to 127.0.0.1:18091.
    location = /admin {
        return 403;
    }
    location ^~ /admin/ {
        return 403;
    }
    location = /realms/master {
        return 403;
    }
    location ^~ /realms/master/ {
        return 403;
    }

    # Same-origin Keycloak OIDC & broker endpoints (/realms/clopssoc/* and
    # /resources/*), matching SREOps so no second subdomain is required.
    location ~ ^/realms/[^/]+/login-actions/ {
        limit_req zone=aisoc_login burst=10 nodelay;
        include /etc/nginx/snippets/proxy-headers.conf;
        proxy_read_timeout 60s;
        proxy_pass $keycloak_upstream;
    }

    location ~ ^/realms/[^/]+/protocol/openid-connect/(auth|token|registrations) {
        limit_req zone=aisoc_auth burst=20 nodelay;
        include /etc/nginx/snippets/proxy-headers.conf;
        proxy_read_timeout 60s;
        proxy_pass $keycloak_upstream;
    }

    location ^~ /realms/ {
        include /etc/nginx/snippets/proxy-headers.conf;
        proxy_read_timeout 120s;
        proxy_pass $keycloak_upstream;
    }

    location ^~ /resources/ {
        include /etc/nginx/snippets/proxy-headers.conf;
        proxy_read_timeout 120s;
        proxy_pass $keycloak_upstream;
    }

    # Password login — the credential endpoint, rate limited hardest.
    location = /api/v1/auth/login {
        limit_req zone=aisoc_login burst=5 nodelay;
        include /etc/nginx/snippets/proxy-headers.conf;
        proxy_read_timeout 60s;
        proxy_pass $web_upstream;
    }

    # Identity-provider browser flows (/auth/oidc/*, /auth/saml/*). Next
    # forwards these to the API; they are a handful of redirects per sign-in.
    location /auth/ {
        limit_req zone=aisoc_auth burst=20 nodelay;
        include /etc/nginx/snippets/proxy-headers.conf;
        proxy_read_timeout 60s;
        proxy_pass $web_upstream;
    }

    # WebSocket. Next's rewrite table lists `/ws/:path*`, but a rewrite does
    # not carry the Upgrade handshake, so this path has to go to the gateway
    # directly. The read timeout is an hour: an idle alert channel reconnects
    # on the client's schedule, not on a 60-second proxy timeout.
    location /ws {
        include /etc/nginx/snippets/proxy-headers.conf;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        proxy_pass $realtime_upstream;
    }

    # Server-sent events. Buffering off is the whole point: an event written
    # into a proxy buffer is an alert that arrives when the buffer fills, not
    # when it happens.
    location = /sse {
        include /etc/nginx/snippets/proxy-headers.conf;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        chunked_transfer_encoding off;
        proxy_pass $realtime_upstream;
    }

    # Everything else — pages, /_next/static, /api/v1/*, the health route.
    # 120s matches the web image's default proxy budget
    # (AISOC_PROXY_TIMEOUT_MS), so long copilot and investigation calls are
    # cut by the application, which can explain itself, not by the proxy.
    location / {
        include /etc/nginx/snippets/proxy-headers.conf;
        proxy_read_timeout 120s;
        proxy_pass $web_upstream;
    }
}
