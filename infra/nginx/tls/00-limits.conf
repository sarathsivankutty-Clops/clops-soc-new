# Shared limits, in the `http` context (every file in conf.d is included
# there). One zone per surface rather than one for the whole site, because a
# shared bucket lets a login flood lock out ordinary page loads.
#
# Keyed on $binary_remote_addr: nginx is the edge, so this is the client the
# internet sees, not an upstream hop. Behind another proxy this key would have
# to change to the header that proxy sets.

# Password login. 10 attempts a minute per address with a burst of 5 covers a
# person mistyping twice; it does not cover a credential-stuffing run. The API
# keeps its own per-account lockout (services/api/app/services/login_throttle.py)
# — this is the cheaper outer layer, not a replacement.
limit_req_zone $binary_remote_addr zone=aisoc_login:10m rate=10r/m;

# /auth/* is the identity-provider browser flow: a redirect out and a callback
# back, so a normal sign-in is a handful of requests. 30r/m with a larger burst
# leaves room for SAML/OIDC round trips without leaving the endpoint open.
limit_req_zone $binary_remote_addr zone=aisoc_auth:10m rate=30r/m;

# 429 instead of nginx's default 503: a rate limit is not an outage, and the
# console's error handling tells them apart.
limit_req_status 429;

server_tokens off;
