# Response headers that cannot break the console.
#
# Deliberately no Content-Security-Policy: the Next.js pages ship inline
# bootstrap scripts (theme and locale are applied before paint) and a policy
# written here without auditing every bundle would white-screen the app. It is
# a separate piece of work; see docs/DEPLOY-HTTPS.md.
#
# `always` so the headers are present on 4xx/5xx too — a redirect or an error
# page without `nosniff` is exactly where a content-type sniff turns into an
# XSS.
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
