# Headers the API, the agents service and the realtime gateway read when they
# describe where a request came from. Included inside each `location`, not at
# server level: `proxy_set_header` inherits, but repeating it here keeps every
# proxied route's header set visible next to the `proxy_pass` it belongs to.
#
# X-Forwarded-Proto is `$scheme`, so the API sees `https` on the TLS listener.
# Nothing in the API trusts X-Forwarded-For unless AISOC_TRUSTED_PROXIES names
# this container — see the [TODO] beside `api` in docker-compose.yml.
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header X-Forwarded-Port $server_port;
proxy_http_version 1.1;
