# The hostname this server block answers for. It is an include, not a literal
# inside the block, so a second host is a second file plus a second server
# block — the first block is never edited to add one.
#
# Reference for the second block (Keycloak at auth.cloudifyops.com):
# `infra/nginx/tls/30-auth.conf.example`, which includes
# `snippets/server-name-auth.conf`.
server_name soc.cloudifyops.com;
