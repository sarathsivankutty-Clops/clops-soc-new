# HTTP-01 challenge, served from the volume shared with the `certbot` service.
#
# `^~` so no prefix location added later can shadow it, and no rewrite applies:
# Certbot writes a file with no extension under this path and nginx has to
# return exactly those bytes. A redirect here would fail validation, which is
# the usual way an ACME webroot breaks after "just adding HTTPS redirect".
#
# `root`, not `alias`: the path after the location is the filename Certbot
# wrote, so the file lands at /var/www/certbot/.well-known/acme-challenge/<tok>.
location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
    default_type text/plain;
    try_files $uri =404;
    access_log off;
}
