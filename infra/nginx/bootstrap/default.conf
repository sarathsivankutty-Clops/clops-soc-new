# Bootstrap: HTTP only, no certificate.
#
# This is what nginx starts with on a host that has never had a certificate.
# It cannot be the TLS config: `ssl_certificate` pointing at a file that does
# not exist makes nginx refuse to start at all, so the first `up` would fail
# and Certbot would have no web server to answer its challenge.
#
# Order of operations (docs/DEPLOY-HTTPS.md):
#   1. this config, `up -d nginx`            -> :80 answers the challenge
#   2. `docker compose run --rm certbot`     -> staging cert, then the real one
#   3. NGINX_CONF_DIR=tls, recreate nginx    -> 20-soc.conf takes over :443
limit_req_zone $binary_remote_addr zone=aisoc_acme:10m rate=60r/m;

# Unknown Host header: close the connection. A default server that answers
# anything is a scanner's fingerprint of choice, and 444 sends no response at
# all rather than a version banner.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    server_tokens off;

    # Reached by the compose healthcheck for any Host header, so it stays
    # green before and after the switch to TLS.
    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
    }

    location / {
        return 444;
    }
}

# The real host. Nothing is served yet, so every request is redirected to the
# TLS listener that will exist once the certificate is issued.
server {
    listen 80;
    listen [::]:80;
    include /etc/nginx/snippets/server-name-soc.conf;
    include /etc/nginx/snippets/security-headers.conf;
    server_tokens off;

    include /etc/nginx/snippets/acme-challenge.conf;

    location / {
        return 301 https://$host$request_uri;
    }
}

# Identity provider (auth.cloudifyops.com) — HTTP-01 challenge before TLS is up.
server {
    listen 80;
    listen [::]:80;
    include /etc/nginx/snippets/server-name-auth.conf;
    include /etc/nginx/snippets/security-headers.conf;
    server_tokens off;

    include /etc/nginx/snippets/acme-challenge.conf;

    location / {
        return 301 https://$host$request_uri;
    }
}
